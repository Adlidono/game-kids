<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#79c9ff" />
  <title>Math Kids: Kira & Jawab</title>
  <style>
    :root {
      --sky: #79c9ff;
      --sky-deep: #409ee9;
      --mint: #a8e6cf;
      --mint-deep: #49b98e;
      --yellow: #ffe47a;
      --yellow-deep: #f2b93b;
      --cream: #fffdf2;
      --ink: #25435a;
      --soft-red: #ff7878;
      --white: #ffffff;
      --shadow: 0 12px 30px rgba(37, 67, 90, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(255,255,255,.75) 0 45px, transparent 46px),
        radial-gradient(circle at 88% 20%, rgba(255,255,255,.6) 0 60px, transparent 61px),
        linear-gradient(160deg, #bde8ff 0%, #dff8ee 55%, #fff3af 100%);
      display: grid;
      place-items: center;
      padding: 18px;
      overflow-x: hidden;
    }

    .game-shell {
      position: relative;
      width: min(920px, 100%);
      min-height: min(690px, calc(100vh - 36px));
      background: rgba(255, 253, 242, 0.94);
      border: 5px solid rgba(255,255,255,.9);
      border-radius: 32px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .decor {
      position: absolute;
      z-index: 0;
      user-select: none;
      pointer-events: none;
      opacity: .7;
      animation: floaty 4s ease-in-out infinite;
    }
    .decor.one { top: 90px; left: 20px; font-size: 35px; }
    .decor.two { top: 150px; right: 20px; font-size: 38px; animation-delay: -1.2s; }
    .decor.three { bottom: 22px; left: 26px; font-size: 32px; animation-delay: -2s; }
    .decor.four { bottom: 28px; right: 30px; font-size: 34px; animation-delay: -.5s; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
    }

    header {
      position: relative;
      z-index: 2;
      background: linear-gradient(110deg, var(--sky), #8dd9ff 50%, var(--mint));
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 5px solid rgba(255,255,255,.8);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2.35rem);
      line-height: 1.05;
      color: #fff;
      text-shadow: 0 3px 0 rgba(30, 110, 160, .25);
    }

    .brand p {
      margin: 6px 0 0;
      font-size: clamp(.82rem, 2vw, 1rem);
      font-weight: 800;
      color: #205d7a;
    }

    .score-card {
      flex: 0 0 auto;
      min-width: 128px;
      padding: 10px 15px;
      border-radius: 22px;
      background: rgba(255,255,255,.94);
      border: 3px solid var(--yellow);
      box-shadow: 0 6px 0 rgba(54, 137, 179, .18);
      text-align: center;
      font-weight: 900;
    }

    .score-card .stars { letter-spacing: 2px; font-size: 1.05rem; }
    .score-card .score { display: block; margin-top: 3px; font-size: 1.3rem; }

    main {
      position: relative;
      z-index: 1;
      padding: clamp(20px, 4vw, 38px);
      text-align: center;
    }

    .level-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--yellow);
      color: #725715;
      border-radius: 999px;
      font-weight: 900;
      box-shadow: 0 5px 0 #e9c14e;
    }

    .instruction {
      margin: 22px 0 13px;
      font-size: clamp(1.08rem, 3vw, 1.45rem);
      font-weight: 900;
    }

    .question-card {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: clamp(18px, 4vw, 30px);
      background: white;
      border: 4px solid #d8f1ff;
      border-radius: 28px;
      box-shadow: 0 10px 0 #cdeaf7;
    }

    .visual-equation {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: clamp(10px, 2.5vw, 22px);
      min-height: 105px;
    }

    .fish-group {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 240px;
      padding: 9px 12px;
      background: #eafdff;
      border: 3px dashed #8cd3f1;
      border-radius: 22px;
    }

    .fish {
      display: inline-block;
      font-size: clamp(2rem, 6vw, 3.25rem);
      filter: drop-shadow(0 4px 1px rgba(37,67,90,.12));
      animation: swimIn .45s ease both;
    }

    @keyframes swimIn {
      from { opacity: 0; transform: translateX(-16px) scale(.7); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    .operator {
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 1000;
      color: var(--sky-deep);
    }

    .number-equation {
      margin-top: 18px;
      font-size: clamp(2rem, 7vw, 3.7rem);
      letter-spacing: 4px;
      font-weight: 1000;
      color: #31657f;
    }

    .feedback {
      min-height: 46px;
      margin: 17px 0 8px;
      font-size: clamp(1.2rem, 4vw, 1.7rem);
      font-weight: 1000;
    }
    .feedback.correct { color: var(--mint-deep); animation: pop .35s ease; }
    .feedback.wrong { color: var(--soft-red); animation: shake .35s ease; }

    .answers {
      width: min(680px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .answer-btn {
      min-height: 82px;
      border: 0;
      border-radius: 22px;
      background: linear-gradient(180deg, var(--yellow), #ffd95a);
      color: #5f4b15;
      font: inherit;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 1000;
      cursor: pointer;
      box-shadow: 0 8px 0 var(--yellow-deep), 0 12px 18px rgba(80,70,20,.12);
      transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .answer-btn:nth-child(even) {
      background: linear-gradient(180deg, #bdf0dc, #91dfc1);
      color: #225e4a;
      box-shadow: 0 8px 0 #58bd98, 0 12px 18px rgba(30,90,70,.12);
    }

    .answer-btn:hover { transform: translateY(-3px); filter: brightness(1.03); }
    .answer-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--yellow-deep); }
    .answer-btn:focus-visible { outline: 5px solid rgba(64,158,233,.35); outline-offset: 3px; }
    .answer-btn:disabled { cursor: default; opacity: .75; }

    .answer-btn.is-correct {
      background: #6fe0ab;
      box-shadow: 0 8px 0 #36a979;
      color: #104c35;
      animation: pop .35s ease;
    }
    .answer-btn.is-wrong { animation: shake .35s ease; background: #ffb2b2; box-shadow: 0 8px 0 #e87676; }

    .tip {
      margin: 23px 0 0;
      font-size: .93rem;
      font-weight: 800;
      color: #6b8797;
    }

    .star-burst {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      animation: burst 900ms ease-out forwards;
    }

    @keyframes burst {
      0% { opacity: 0; transform: translate(0, 0) scale(.25) rotate(0); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.35) rotate(240deg); }
    }

    @keyframes pop {
      0% { transform: scale(.8); }
      65% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-5px); }
    }

    @media (max-width: 620px) {
      body { padding: 0; background: var(--cream); }
      .game-shell { min-height: 100vh; border: 0; border-radius: 0; }
      header { padding: 14px 15px; }
      .score-card { min-width: 104px; padding: 8px 10px; }
      main { padding: 20px 14px 30px; }
      .question-card { padding: 18px 12px; }
      .answers { grid-template-columns: repeat(2, 1fr); gap: 13px; }
      .answer-btn { min-height: 74px; }
      .decor { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <section class="game-shell" aria-label="Permainan Matematik Kanak-kanak">
    <span class="decor one">☁️</span>
    <span class="decor two">🌈</span>
    <span class="decor three">🌼</span>
    <span class="decor four">☀️</span>

    <header>
      <div class="brand">
        <h1>Math Kids: Kira &amp; Jawab</h1>
        <p>Belajar tambah sambil bermain!</p>
      </div>
      <div class="score-card" aria-live="polite">
        <div class="stars">⭐ ⭐ ⭐</div>
        <span class="score">Skor: <span id="score">0</span></span>
      </div>
    </header>

    <main>
      <div class="level-pill">🐠 Level 1: Tambah Mudah</div>
      <p class="instruction">Kira semua ikan. Berapakah jumlahnya?</p>

      <section class="question-card" aria-label="Soalan matematik">
        <div class="visual-equation">
          <div class="fish-group" id="groupA" aria-label="Kumpulan ikan pertama"></div>
          <span class="operator" aria-hidden="true">+</span>
          <div class="fish-group" id="groupB" aria-label="Kumpulan ikan kedua"></div>
          <span class="operator" aria-hidden="true">= ?</span>
        </div>
        <div class="number-equation" id="numberEquation"></div>
      </section>

      <div class="feedback" id="feedback" role="status" aria-live="assertive"></div>
      <div class="answers" id="answers" aria-label="Pilihan jawapan"></div>
      <p class="tip">💡 Tip: Sentuh atau klik nombor jawapan yang betul.</p>
    </main>
  </section>

  <script>
    (() => {
      "use strict";

      const scoreElement = document.getElementById("score");
      const groupA = document.getElementById("groupA");
      const groupB = document.getElementById("groupB");
      const numberEquation = document.getElementById("numberEquation");
      const answersContainer = document.getElementById("answers");
      const feedback = document.getElementById("feedback");

      let score = 0;
      let currentAnswer = 0;
      let locked = false;
      let audioContext = null;

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function makeFish(count, container) {
        container.innerHTML = "";
        const colors = ["🐟", "🐠"];
        for (let i = 0; i < count; i++) {
          const fish = document.createElement("span");
          fish.className = "fish";
          fish.textContent = colors[i % colors.length];
          fish.style.animationDelay = `${i * 55}ms`;
          fish.setAttribute("aria-hidden", "true");
          container.appendChild(fish);
        }
        container.setAttribute("aria-label", `${count} ekor ikan`);
      }

      function createChoices(answer) {
        const choices = new Set([answer]);
        while (choices.size < 4) {
          const offset = randomInt(-3, 3);
          const candidate = answer + offset;
          if (candidate >= 1 && candidate <= 10) choices.add(candidate);
        }
        return [...choices].sort(() => Math.random() - 0.5);
      }

      function newQuestion() {
        locked = false;
        feedback.textContent = "";
        feedback.className = "feedback";

        const first = randomInt(1, 5);
        const second = randomInt(1, 5);
        currentAnswer = first + second;

        makeFish(first, groupA);
        makeFish(second, groupB);
        numberEquation.textContent = `${first} + ${second} = ?`;

        answersContainer.innerHTML = "";
        createChoices(currentAnswer).forEach(choice => {
          const button = document.createElement("button");
          button.className = "answer-btn";
          button.type = "button";
          button.textContent = choice;
          button.setAttribute("aria-label", `Jawapan ${choice}`);
          button.addEventListener("click", () => checkAnswer(choice, button));
          answersContainer.appendChild(button);
        });
      }

      function checkAnswer(choice, button) {
        if (locked) return;

        if (choice === currentAnswer) {
          locked = true;
          button.classList.add("is-correct");
          [...answersContainer.children].forEach(btn => btn.disabled = true);
          score += 10;
          scoreElement.textContent = score;
          feedback.textContent = "Hebat! Jawapan betul! 🎉";
          feedback.className = "feedback correct";
          playHappySound();
          createStarBurst(button);
          setTimeout(newQuestion, 1200);
        } else {
          button.classList.remove("is-wrong");
          void button.offsetWidth;
          button.classList.add("is-wrong");
          feedback.textContent = "Cuba lagi! Kamu boleh! 💪";
          feedback.className = "feedback wrong";
          playTryAgainSound();
        }
      }

      function getAudioContext() {
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioContext = new AudioCtx();
        }
        return audioContext;
      }

      function playTone(frequency, start, duration, type = "sine", volume = 0.12) {
        const ctx = getAudioContext();
        if (!ctx) return;
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, ctx.currentTime + start);
        gain.gain.setValueAtTime(0.001, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start(ctx.currentTime + start);
        oscillator.stop(ctx.currentTime + start + duration + 0.03);
      }

      function playHappySound() {
        playTone(523.25, 0, .16, "triangle");
        playTone(659.25, .13, .16, "triangle");
        playTone(783.99, .26, .24, "triangle");
      }

      function playTryAgainSound() {
        playTone(330, 0, .12, "sine", .06);
        playTone(294, .1, .14, "sine", .05);
      }

      function createStarBurst(sourceButton) {
        const rect = sourceButton.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        for (let i = 0; i < 14; i++) {
          const star = document.createElement("span");
          star.className = "star-burst";
          star.textContent = i % 3 === 0 ? "✨" : "⭐";
          star.style.left = `${centerX}px`;
          star.style.top = `${centerY}px`;
          const angle = (Math.PI * 2 * i) / 14;
          const distance = randomInt(70, 170);
          star.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          star.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          star.style.animationDelay = `${i * 18}ms`;
          document.body.appendChild(star);
          star.addEventListener("animationend", () => star.remove());
        }
      }

      newQuestion();
    })();
  </script>
</body>
</html>
